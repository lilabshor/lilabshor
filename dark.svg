<svg width="860" height="425" viewBox="0 0 860 425" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#070c1a"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>

    <!-- Animated Cyber Glow Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ec4899;#a855f7;#00f0ff" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Neon Text Gradients -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cyber Background Grid -->
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111d33" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="20" cy="0" r="1" fill="#00f0ff" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'Courier New', Consolas, monospace; }
    .label { fill: #38bdf8; font-size: 12px; font-weight: 500; }
    .val { fill: #f8fafc; font-size: 11.5px; font-weight: 600; text-anchor: end; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="856" height="421" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>
  <rect x="3" y="3" width="854" height="419" rx="13" fill="url(#cyberGrid)" />

  <!-- Title Bar -->
  <rect x="2" y="2" width="856" height="42" rx="14" fill="#070c18" fill-opacity="0.95" />
  <line x1="2" y1="44" x2="858" y2="44" stroke="#15243d" stroke-width="1.2"/>

  <!-- Window Controls -->
  <circle cx="28" cy="23" r="6" fill="#ef4444" />
  <circle cx="48" cy="23" r="6" fill="#eab308" />
  <circle cx="68" cy="23" r="6" fill="#22c55e" />

  <!-- Command Title -->
  <text x="430" y="27" class="font-mono" fill="#00f0ff" font-size="12" font-weight="600" text-anchor="middle" filter="url(#subtleGlow)">
   lilabshor@zone:~$ ./imajinasi_unlimited.sh --live
  </text>

  <!-- LEFT PANEL: Virtual Map & Rotating Hologram -->
  <rect x="22" y="60" width="265" height="340" rx="10" fill="#060a14" stroke="#162744" stroke-width="1.2"/>
  
  <text x="38" y="85" class="font-mono" fill="#00f0ff" font-size="10" font-weight="700" letter-spacing="2.5">
    ◈ V I R T U A L . M A P
  </text>
  
  <!-- Outer Rotating Rings -->
  <g transform="translate(154, 218)">
    <circle cx="0" cy="0" r="95" stroke="#13243d" stroke-width="1.5" stroke-dasharray="8 6" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="74" stroke="#00f0ff" stroke-width="1" stroke-dasharray="20 12 4 12" stroke-opacity="0.5" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- Orbiting Particle -->
    <circle cx="74" cy="0" r="3.5" fill="#ec4899" filter="url(#subtleGlow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- Target Crosshair -->
    <circle cx="0" cy="0" r="50" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4" fill="none"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#13243d" stroke-width="0.8" stroke-dasharray="4 4" />
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#13243d" stroke-width="0.8" stroke-dasharray="4 4" />
  </g>

  <!-- Pulsing Center </> Code Emblem -->
  <g filter="url(#neonGlow)">
    <text x="154" y="238" class="font-mono" fill="url(#neonPurple)" font-size="54" font-weight="900" text-anchor="middle">
      &lt; / &gt;
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Active Status Tag -->
  <rect x="40" y="348" width="228" height="32" rx="6" fill="#091326" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="58" cy="364" r="4" fill="#00f0ff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="158" y="368" class="font-mono" fill="#00f0ff" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">
    IMAGINATION ZONE : ACTIVE
  </text>

  <!-- RIGHT PANEL: System Info -->
  <g class="font-mono">
    <!-- Header -->
    <text x="315" y="85" fill="#00f0ff" font-size="12.5" font-weight="700" letter-spacing="2">SYSTEM.INFO</text>
    
    <!-- Live Pulse Indicator -->
    <g transform="translate(805, 81)">
      <circle cx="0" cy="0" r="4" fill="#22c55e" stroke="#22c55e" stroke-width="1">
        <animate attributeName="r" values="4;11;4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="4" fill="#22c55e" filter="url(#subtleGlow)"/>
      <text x="12" y="4" fill="#22c55e" font-size="11" font-weight="700">LIVE</text>
    </g>

    <!-- Zone Pill Badge -->
    <rect x="315" y="100" width="280" height="22" rx="5" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1"/>
    <text x="325" y="115" fill="#ffffff" font-size="10.5" font-weight="700" letter-spacing="0.3">✦ Welcome to my profile di zona saya!</text>

    <!-- Rows -->
    <!-- Row 1: Subject -->
    <text x="315" y="152" class="label">Subject</text>
    <text x="835" y="152" class="val">Charlie</text>
    
    <!-- Row 2: Role -->
    <text x="315" y="180" class="label">Role</text>
    <text x="835" y="180" class="val" fill="#f43f5e">Berpikir Berlebihan</text>
    
    <!-- Row 3: Daily.Formula -->
    <text x="315" y="208" class="label">Daily.Formula</text>
    <text x="835" y="208" fill="url(#neonPurple)" font-size="11.5" font-weight="800" text-anchor="end" filter="url(#subtleGlow)">
      50% Imajinasi, 50% Nekat Nyoba 🪄
    </text>

    <!-- Row 4: Misi.Utama -->
    <text x="315" y="236" class="label">Misi.Utama</text>
    <text x="835" y="236" class="val" fill="#e2e8f0" font-size="10.8">Bersenang-senang &amp; Berkarya Bebas Sesuai Imajinasi</text>

    <!-- Row 5: Toolchain -->
    <text x="315" y="264" class="label">Toolchain</text>
    <text x="835" y="264" class="val" fill="#38bdf8">Rahasia dong, kalau dikasih tahu nanti naksir 😉</text>

    <!-- Row 6: Core.Stack -->
    <text x="315" y="292" class="label">Core.Stack</text>
    <text x="835" y="292" class="val" fill="#cbd5e1">Apa Saja yang Melintas di Pikiran 🧠</text>

    <!-- Row 7: Origin -->
    <text x="315" y="320" class="label">Origin</text>
    <text x="835" y="320" class="val">Planet Bumi 🌍</text>

    <!-- Connectivity -->
    <text x="315" y="348" fill="#64748b" font-size="11">─── connectivity ───</text>
    <text x="315" y="370" class="label">Grid.GitHub</text>
    <text x="835" y="370" fill="#a855f7" font-size="12" font-weight="700" text-anchor="end">@punyacharlie236-ui</text>

    <!-- Bottom prompt -->
    <line x1="315" y1="384" x2="835" y2="384" stroke="#162744" stroke-dasharray="3 3"/>
    <text x="315" y="405" fill="#64748b" font-size="11">&gt; Imagination mode active. Happy exploring :</text>
    <rect x="590" y="394" width="8" height="13" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
